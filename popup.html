<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="popup.css" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="app-icon">
          <img src="icon.png" alt="Interacto Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
        <h1>Interacto </h1>
      </div>
      <div class="header-right">
        <button id="clearBtn" class="icon-btn" title="Clear Chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn" title="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Mode Selector -->
    <div class="mode-toggle">
      <button id="screenModeBtn" class="toggle-btn active">Screen Capture</button>
      <button id="manualModeBtn" class="toggle-btn">Manual Input</button>
    </div>

    <!-- Main Content Area -->
    <div class="main-content" id="mainContent">
      
      <!-- Default State -->
      <div id="defaultState" class="state-container">
        <div class="hero-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
        <h2>Ready to Analyze</h2>
        <p class="subtitle">Capture a region or paste text to get instant insights.</p>

        <div class="action-cards">
          <button id="btnSemantic" class="action-card">
            <div class="card-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            </div>
            <div class="card-text">
              <h3>Semantic Extraction</h3>
              <p>Auto-identifies key entities and themes.</p>
            </div>
          </button>
          
          <button id="btnSentiment" class="action-card">
            <div class="card-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
            </div>
            <div class="card-text">
              <h3>Sentiment Analysis</h3>
              <p>Detects tone and emotional intent.</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Results State -->
      <div id="resultsState" class="state-container" style="display: none;">
        <div class="results-header">
          <h3>VISUAL INSIGHTS</h3>
          <span class="badge">Real-time</span>
        </div>
        
        <div class="chart-wrapper">
          <canvas id="mainChart"></canvas>
          <div id="chartOverlay" class="chart-overlay">Data Visualization Layer</div>
        </div>

        <div id="textResults" class="text-results">
          <!-- Text analysis will appear here -->
        </div>
      </div>
      
      <!-- Loading State -->
      <div id="loadingState" class="state-container" style="display: none;">
        <div class="spinner"></div>
        <p class="loading-text">Processing with AI...</p>
      </div>

    </div>

    <!-- Input Section -->
    <div class="input-section">
      <div class="input-box" id="manualInputBox" style="display: none;">
        <textarea id="promptInput" placeholder="Enter text to analyze..."></textarea>
        <div class="input-actions">
          <button class="attach-btn" title="Attach file">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button id="sendBtn" class="send-btn" title="Send Prompt">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
          </button>
        </div>
      </div>
      <button id="analyzePageBtn" class="analyze-page-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Analyze Page
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      A Product by Bhavya Pandey
    </footer>

  </div>

  <script src="chart.js"></script>
  <script src="popup.js"></script>
</body>
</html>
